; Overrides of php.ini-production for Phorge.

; Upload limit. Keep it equal to client_max_body_size in nginx.conf and to
; max-allowed-packet of the database server.
post_max_size = 32M
upload_max_filesize = 32M

; Phorge limits the memory of its own operations.
memory_limit = -1

; The source is part of the image and never changes while the container runs,
; so PHP does not have to check the files for changes.
opcache.validate_timestamps = 0

mysqli.allow_local_infile = 0

; Phorge sets the time zone it displays from its own configuration.
date.timezone = UTC
