; supervisord starts the three programs of the Phorge container and restarts
; one that exits. All output goes to the log of the container.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[program:php-fpm]
command = php-fpm -F
stopsignal = QUIT
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = nginx -g "daemon off;"
stopsignal = QUIT
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; The daemons run as the user of the web server, because both read and write
; the same files. supervisord does not change HOME when it changes the user.
; SIGINT lets every daemon finish the task it is working on.
[program:phd]
command = /usr/local/bin/phd.sh
user = www-data
environment = HOME="/var/www",USER="www-data"
stopsignal = INT
stopwaitsecs = 60
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true
